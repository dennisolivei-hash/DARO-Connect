<style>
  :root{
    --navy-950:#050912;
    --navy-900:#0a1122;
    --navy-800:#101a30;
    --navy-700:#16233f;
    --navy-600:#1d2e4e;
    --cyan-400:#4ee8ff;
    --cyan-500:#1ec8e8;
    --cyan-glow:rgba(78,232,255,0.35);
    --coral-500:#ff6a55;
    --coral-600:#ef5443;
    --silver-300:#c7d4e6;
    --silver-500:#8ea0bd;
    --text-hi:#eef4fc;
    --text-mid:#a9b8d2;
    --text-dim:#6d7c9a;
    --cut:16px;
    --cut-sm:10px;
    --danger:#ff5c5c;
    --online:#3ee08c;
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  html,body{height:100%; overflow:hidden;}

  body{
    font-family:'Space Grotesk', system-ui, sans-serif;
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(30,200,232,0.10), transparent 60%),
      radial-gradient(900px 500px at 110% 10%, rgba(255,106,85,0.08), transparent 55%),
      var(--navy-950);
    color:var(--text-hi);
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
  }

  /* ---------- decorative background grid ---------- */
  .bg-grid{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image:
      linear-gradient(rgba(78,232,255,0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(78,232,255,0.045) 1px, transparent 1px);
    background-size:42px 42px;
    -webkit-mask-image:radial-gradient(ellipse 90% 70% at 50% 20%, #000 0%, transparent 75%);
            mask-image:radial-gradient(ellipse 90% 70% at 50% 20%, #000 0%, transparent 75%);
  }
  .bg-scan{
    position:fixed; left:0; right:0; height:2px; z-index:0; pointer-events:none;
    background:linear-gradient(90deg, transparent, var(--cyan-glow), transparent);
    animation:scan 7s linear infinite;
    opacity:.5;
  }
  @keyframes scan{
    0%{ top:-2%; }
    100%{ top:102%; }
  }

  /* ---------- chamfer / HUD panel utility ---------- */
  .chamfer-wrap{
    position:relative;
    padding:1.5px;
    background:linear-gradient(135deg, rgba(78,232,255,0.9), rgba(255,106,85,0.55) 55%, rgba(78,232,255,0.25));
    clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut));
  }
  .chamfer-inner{
    background:var(--navy-800);
    clip-path:polygon(calc(var(--cut) - 1.5px) 0,100% 0,100% calc(100% - var(--cut) + 1.5px),calc(100% - var(--cut) + 1.5px) 100%,0 100%,0 calc(var(--cut) - 1.5px));
    height:100%; width:100%;
  }
  .chamfer-wrap.sm, .chamfer-wrap.sm .chamfer-inner{ --cut:var(--cut-sm); }

  #app{ position:relative; z-index:1; min-height:100vh; }

  .screen{ display:none; min-height:100vh; }
  .screen.active{ display:flex; }

  /* ================= ENTRY SCREEN ================= */
  #screen-entry{
    align-items:center; justify-content:center;
    padding:32px 20px;
    height:100vh; max-height:100vh; overflow-y:auto;
  }
  @supports (height: 100dvh){
    #screen-entry{ height:100dvh; max-height:100dvh; }
  }

  .entry-card-outer{ width:100%; max-width:460px; }
  .entry-card{
    padding:38px 34px 30px;
    display:flex; flex-direction:column; align-items:center; gap:6px;
  }

  .brand-logo{
    width:112px; height:auto; filter:drop-shadow(0 0 18px rgba(78,232,255,0.25));
    margin-bottom:6px;
  }

  .app-title{
    font-size:26px; font-weight:700; letter-spacing:0.5px;
    background:linear-gradient(90deg, var(--text-hi), var(--cyan-400));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .app-subtitle{
    font-size:13px; color:var(--text-dim); letter-spacing:0.4px;
    margin-bottom:22px; text-align:center;
  }

  .field-label{
    align-self:flex-start;
    font-size:11px; text-transform:uppercase; letter-spacing:1.2px;
    color:var(--cyan-400); font-weight:600; margin:14px 0 8px;
  }

  .text-input{
    width:100%; background:var(--navy-900); border:1px solid var(--navy-600);
    color:var(--text-hi); font-family:inherit; font-size:15px;
    padding:12px 14px; outline:none;
    clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
    transition:border-color .15s, box-shadow .15s;
  }
  .text-input:focus{ border-color:var(--cyan-500); box-shadow:0 0 0 3px rgba(30,200,232,0.15); }
  .text-input::placeholder{ color:var(--text-dim); }

  .mode-toggle{
    display:flex; gap:8px; width:100%; margin-top:4px;
  }
  .mode-btn{
    flex:1; cursor:pointer; user-select:none;
    background:var(--navy-900); border:1px solid var(--navy-600);
    color:var(--text-mid); font-family:inherit; font-size:12px; font-weight:600;
    padding:9px 4px; text-align:center;
    clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
    display:flex; align-items:center; justify-content:center; gap:5px;
    transition:all .15s;
  }
  .mode-btn svg{ width:14px; height:14px; opacity:.8; flex-shrink:0; }
  .mode-btn.active{
    background:rgba(30,200,232,0.12); border-color:var(--cyan-500); color:var(--cyan-400);
  }

  .camera-select{
    width:100%; margin-top:10px; background:var(--navy-900); border:1px solid var(--navy-600);
    color:var(--text-mid); font-family:inherit; font-size:12.5px; padding:8px 10px; outline:none;
    clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
    display:none;
  }
  .camera-select:focus{ border-color:var(--cyan-500); }

  .preview-zone{
    width:100%; margin-top:16px;
    aspect-ratio:16/10;
    background:var(--navy-900);
    position:relative; overflow:hidden;
    clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);
    display:flex; align-items:center; justify-content:center;
    border:1px solid var(--navy-600);
  }
  .preview-zone video{ width:100%; height:100%; object-fit:cover; transform:scaleX(-1); display:none; }
  .preview-zone img{ width:100%; height:100%; object-fit:cover; display:none; }
  .preview-placeholder{
    display:flex; flex-direction:column; align-items:center; gap:8px;
    color:var(--text-dim); font-size:12.5px; text-align:center; padding:12px;
  }
  .preview-placeholder svg{ width:34px; height:34px; opacity:.55; }

  .avatar-upload-btn{
    position:absolute; bottom:10px; right:10px;
    background:rgba(10,17,34,0.85); border:1px solid var(--cyan-500);
    color:var(--cyan-400); font-family:inherit; font-size:11.5px; font-weight:600;
    padding:7px 12px; cursor:pointer; display:none;
    clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);
  }

  .corner-brackets span{
    position:absolute; width:16px; height:16px; pointer-events:none;
  }
  .corner-brackets span:nth-child(1){ top:6px; left:6px; border-top:2px solid var(--cyan-400); border-left:2px solid var(--cyan-400); }
  .corner-brackets span:nth-child(2){ top:6px; right:6px; border-top:2px solid var(--cyan-400); border-right:2px solid var(--cyan-400); }
  .corner-brackets span:nth-child(3){ bottom:6px; left:6px; border-bottom:2px solid var(--cyan-400); border-left:2px solid var(--cyan-400); }
  .corner-brackets span:nth-child(4){ bottom:6px; right:6px; border-bottom:2px solid var(--cyan-400); border-right:2px solid var(--cyan-400); }

  .enter-btn{
    margin-top:20px; width:auto; min-width:200px; padding:9px 22px; cursor:pointer;
    background:linear-gradient(90deg, var(--coral-500), var(--coral-600));
    border:none; color:#fff; font-family:inherit; font-weight:700; font-size:13.5px; letter-spacing:0.4px;
    clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
    display:flex; align-items:center; justify-content:center; gap:7px;
    transition:filter .15s, transform .1s;
    box-shadow:0 6px 18px -8px rgba(255,106,85,0.45);
  }
  .enter-btn svg{ width:15px; height:15px; }
  .enter-btn:hover{ filter:brightness(1.08); }
  .enter-btn:active{ transform:translateY(1px); }
  .enter-btn:disabled{ opacity:.45; cursor:not-allowed; filter:none; box-shadow:none; }

  .entry-footer{
    margin-top:22px; font-size:11px; color:var(--text-dim); letter-spacing:0.3px;
    display:flex; align-items:center; gap:6px;
  }
  .entry-footer .dot{ width:5px; height:5px; border-radius:50%; background:var(--cyan-500); }

  .hint-error{
    color:var(--danger); font-size:11.5px; margin-top:8px; display:none; align-self:flex-start;
  }

  /* ================= ROOM SCREEN ================= */
  #screen-room{ flex-direction:column; width:100%; height:100vh; max-height:100vh; overflow:hidden; }
  @supports (height: 100dvh){
    #screen-room{ height:100dvh; max-height:100dvh; }
  }

  .room-header{
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 20px; background:var(--navy-900); border-bottom:1px solid var(--navy-700);
    gap:12px; flex-wrap:wrap;
  }
  .room-header-left{ display:flex; align-items:center; gap:10px; }
  .room-header-left img{ width:28px; height:auto; }
  .room-name{ font-size:15px; font-weight:700; }
  .room-meta{ font-size:11.5px; color:var(--text-dim); display:flex; align-items:center; gap:6px; }
  .room-meta .dot{ width:6px; height:6px; border-radius:50%; background:var(--online); box-shadow:0 0 6px var(--online); }

  .room-header-right{ display:flex; align-items:center; gap:10px; }
  .icon-btn{
    background:var(--navy-800); border:1px solid var(--navy-600); color:var(--text-mid);
    width:36px; height:36px; cursor:pointer; display:flex; align-items:center; justify-content:center;
    clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);
    transition:all .15s; position:relative;
  }
  .icon-btn:hover{ border-color:var(--cyan-500); color:var(--cyan-400); }
  .icon-btn:disabled{ opacity:.35; cursor:not-allowed; }
  .icon-btn:disabled:hover{ border-color:var(--navy-600); color:var(--text-mid); }
  .icon-btn.danger{ border-color:var(--coral-600); color:var(--coral-500); }
  .icon-btn.danger:hover{ background:var(--coral-600); color:#fff; }
  .icon-btn.on{ border-color:var(--cyan-500); color:var(--cyan-400); background:rgba(30,200,232,0.12); }
  .icon-btn.off{ border-color:var(--coral-600); color:var(--coral-500); background:rgba(255,106,85,0.1); }
  .icon-btn svg{ width:17px; height:17px; }
  .icon-btn .badge{
    position:absolute; top:-5px; right:-5px; background:var(--coral-500); color:#fff;
    font-size:9.5px; font-weight:700; min-width:15px; height:15px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; padding:0 3px;
  }

  .room-body{ flex:1; display:flex; overflow:hidden; min-height:0; }

  .video-area{
    flex:1; padding:18px; display:flex; align-items:center; justify-content:center; overflow:auto;
  }
  .video-grid{
    display:grid; gap:14px; width:100%; height:100%;
    grid-template-columns:repeat(auto-fit, minmax(240px,1fr));
    align-content:center;
  }
  .video-grid.spotlight-mode{
    grid-template-columns:repeat(auto-fit, minmax(150px,1fr));
  }

  .tile{
    position:relative; background:var(--navy-800); overflow:hidden;
    aspect-ratio:16/10;
    clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);
    border:1px solid var(--navy-600);
    display:flex; align-items:center; justify-content:center;
  }
  .tile.featured{
    grid-column:1 / -1;
    aspect-ratio:16/9;
    max-height:62vh;
  }
  .tile video{ width:100%; height:100%; object-fit:cover; transform:scaleX(-1); }
  .tile.sharing{ background:#000; }
  .tile.sharing video{ transform:none; object-fit:contain; }
  .tile .tile-avatar{
    width:76px; height:76px; border-radius:50%;
    background:linear-gradient(135deg, var(--cyan-500), var(--navy-700));
    display:flex; align-items:center; justify-content:center;
    font-size:24px; font-weight:700; color:#fff; object-fit:cover;
  }
  .tile .tile-avatar img{ width:100%; height:100%; border-radius:50%; object-fit:cover; }
  .tile-label{
    position:absolute; left:10px; bottom:9px; display:flex; align-items:center; gap:6px;
    background:rgba(5,9,18,0.72); padding:4px 9px; font-size:12px; font-weight:600;
    clip-path:polygon(5px 0,100% 0,100% calc(100% - 5px),calc(100% - 5px) 100%,0 100%,0 5px);
  }
  .tile-label .mic-off{ color:var(--coral-500); }
  .tile-label .mic-off svg{ width:12px; height:12px; }
  .tile.speaking{ border-color:var(--cyan-400); box-shadow:0 0 0 1px var(--cyan-400), 0 0 22px -4px var(--cyan-glow); }
  .tile.self::after{
    content:'VOCÊ'; position:absolute; top:9px; right:9px; font-size:10px; letter-spacing:1px;
    color:var(--cyan-400); background:rgba(5,9,18,0.72); padding:3px 7px;
    clip-path:polygon(4px 0,100% 0,100% calc(100% - 4px),calc(100% - 4px) 100%,0 100%,0 4px);
  }

  .tile .corner-brackets span{ opacity:.55; }

  .control-bar{
    display:flex; align-items:center; justify-content:center; gap:12px;
    padding:14px 20px 20px; background:var(--navy-900); border-top:1px solid var(--navy-700);
  }
  .control-bar .icon-btn{ width:44px; height:44px; }
  .control-bar .icon-btn svg{ width:19px; height:19px; }
  .leave-btn{
    background:var(--coral-500); border:none; color:#fff; font-family:inherit; font-weight:700; font-size:13.5px;
    padding:0 20px; height:44px; cursor:pointer; display:flex; align-items:center; gap:8px;
    clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
    transition:filter .15s;
  }
  .leave-btn:hover{ filter:brightness(1.1); }
  .leave-btn svg{ width:17px; height:17px; }

  /* ---------- chat panel ---------- */
  .chat-panel{
    width:340px; min-width:340px; background:var(--navy-900); border-left:1px solid var(--navy-700);
    display:flex; flex-direction:column; overflow:hidden; min-height:0;
    transform:translateX(0); transition:margin .2s;
  }
  .chat-panel.hidden{ display:none; }

  .chat-header{
    padding:14px 16px; border-bottom:1px solid var(--navy-700);
    display:flex; align-items:center; justify-content:space-between;
  }
  .chat-header h3{ font-size:14px; font-weight:700; letter-spacing:0.3px; }
  .chat-header .icon-btn{ width:28px; height:28px; }
  .chat-header .icon-btn svg{ width:14px; height:14px; }

  .chat-messages{
    flex:1; overflow-y:auto; padding:14px 16px; display:flex; flex-direction:column; gap:14px;
  }
  .msg{ max-width:85%; display:flex; flex-direction:column; gap:4px; }
  .msg.own{ align-self:flex-end; align-items:flex-end; }
  .msg-meta{ font-size:10.5px; color:var(--text-dim); display:flex; gap:6px; align-items:center; }
  .msg-meta .name{ color:var(--cyan-400); font-weight:600; }
  .msg.own .msg-meta .name{ color:var(--coral-500); }
  .msg-bubble{
    background:var(--navy-800); border:1px solid var(--navy-600); padding:9px 12px;
    font-size:13.5px; line-height:1.42; color:var(--text-hi);
    clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
  }
  .msg.own .msg-bubble{ background:rgba(255,106,85,0.12); border-color:rgba(255,106,85,0.4); }
  .msg-bubble img.chat-img{ max-width:100%; display:block; margin-top:4px; clip-path:polygon(5px 0,100% 0,100% calc(100% - 5px),calc(100% - 5px) 100%,0 100%,0 5px); }
  .msg-bubble .file-chip{
    display:flex; align-items:center; gap:8px; margin-top:4px; font-size:12px;
    background:var(--navy-900); border:1px solid var(--navy-600); padding:6px 9px;
    clip-path:polygon(4px 0,100% 0,100% calc(100% - 4px),calc(100% - 4px) 100%,0 100%,0 4px);
  }
  .msg-bubble .file-chip svg{ width:14px; height:14px; color:var(--cyan-400); flex-shrink:0; }

  .chat-input-area{ padding:12px; border-top:1px solid var(--navy-700); position:relative; }
  .attach-preview{
    display:none; align-items:center; gap:8px; background:var(--navy-800); border:1px solid var(--navy-600);
    padding:6px 9px; margin-bottom:8px; font-size:11.5px; color:var(--text-mid);
    clip-path:polygon(4px 0,100% 0,100% calc(100% - 4px),calc(100% - 4px) 100%,0 100%,0 4px);
  }
  .attach-preview button{ margin-left:auto; background:none; border:none; color:var(--coral-500); cursor:pointer; font-size:13px; }
  .attach-preview.error{ color:var(--danger); border-color:var(--danger); }

  .demo-banner{
    background:rgba(255,106,85,0.12); border-bottom:1px solid var(--coral-600); color:var(--coral-500);
    font-size:11.5px; text-align:center; padding:7px 10px; letter-spacing:.3px;
  }

  .chat-input-row{ display:flex; align-items:center; gap:6px; }
  .chat-input-row input[type=text]{
    flex:1; background:var(--navy-800); border:1px solid var(--navy-600); color:var(--text-hi);
    font-family:inherit; font-size:13.5px; padding:10px 12px; outline:none;
    clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
  }
  .chat-input-row input[type=text]:focus{ border-color:var(--cyan-500); }
  .chat-input-row .icon-btn{ width:36px; height:36px; flex-shrink:0; }
  .chat-input-row .icon-btn svg{ width:16px; height:16px; }
  .send-btn{ background:var(--coral-500); border-color:var(--coral-500); color:#fff; }
  .send-btn:hover{ background:var(--coral-600); color:#fff; }

  .emoji-popup{
    display:none; position:absolute; bottom:64px; right:12px; background:var(--navy-800);
    border:1px solid var(--navy-600); padding:8px; grid-template-columns:repeat(6,1fr); gap:4px;
    clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
    z-index:5;
  }
  .emoji-popup button{
    background:none; border:none; font-size:19px; cursor:pointer; padding:5px; border-radius:4px;
  }
  .emoji-popup button:hover{ background:var(--navy-700); }

  .reaction-popup{
    display:none; position:fixed; bottom:78px; left:50%; transform:translateX(-50%);
    background:var(--navy-800); border:1px solid var(--cyan-500); padding:10px;
    grid-template-columns:repeat(6,1fr); gap:6px;
    clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
    z-index:30; box-shadow:0 10px 30px -10px rgba(0,0,0,0.6);
  }
  .reaction-popup button{
    background:none; border:none; font-size:21px; cursor:pointer; padding:6px; border-radius:4px;
  }
  .reaction-popup button:hover{ background:var(--navy-700); }

  .tile-screensharing{
    position:absolute; top:9px; left:9px; display:flex; align-items:center; gap:5px;
    background:rgba(30,200,232,0.15); border:1px solid var(--cyan-500); color:var(--cyan-400);
    font-size:10px; font-weight:700; letter-spacing:.3px; padding:3px 8px;
    clip-path:polygon(4px 0,100% 0,100% calc(100% - 4px),calc(100% - 4px) 100%,0 100%,0 4px);
  }

  .emoji-float{
    position:fixed; font-size:26px; pointer-events:none; animation:floatUp 1.6s ease-out forwards; z-index:50;
  }
  @keyframes floatUp{
    0%{ transform:translateY(0) scale(0.6); opacity:0; }
    15%{ transform:translateY(-10px) scale(1); opacity:1; }
    100%{ transform:translateY(-90px) scale(1.1); opacity:0; }
  }

  /* scrollbar */
  .chat-messages::-webkit-scrollbar, .video-area::-webkit-scrollbar{ width:7px; }
  .chat-messages::-webkit-scrollbar-thumb, .video-area::-webkit-scrollbar-thumb{ background:var(--navy-600); }
  .chat-messages::-webkit-scrollbar-track, .video-area::-webkit-scrollbar-track{ background:transparent; }

  /* responsive */
  @media (max-width:860px){
    .room-body{ flex-direction:column; }
    .chat-panel{ width:100%; min-width:0; height:46vh; border-left:none; border-top:1px solid var(--navy-700); }
    .video-area{ padding:12px; }
  }
  @media (max-width:480px){
    .entry-card{ padding:28px 20px 24px; }
    .room-header{ padding:10px 12px; }
    .room-name{ font-size:13.5px; }
    .control-bar{ gap:8px; flex-wrap:wrap; }
  }

  @media (prefers-reduced-motion:reduce){
    .bg-scan{ animation:none; display:none; }
    .emoji-float{ animation:none; }
  }

  [hidden]{ display:none !important; }
</style>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
<script>
(function(){
  "use strict";

  var EMOJIS = ["😀","😂","😍","👍","👏","🙌","🎉","🔥","❤️","😮","😢","🤔","💡","✅","⚡","🚀","👀","🙏"];
  var MOCK_PEOPLE = [
    { name:"Ana Ferreira", initials:"AF" },
    { name:"Bruno Costa", initials:"BC" }
  ];
  var ICE_SERVERS = { iceServers:[{ urls:'stun:stun.l.google.com:19302' }] };
  var MAX_FILE_BYTES = 5 * 1024 * 1024; // 5MB

  var state = {
    name:"",
    mode:"camera", // 'camera' | 'avatar' | 'nenhum'
    previewStream:null,   // câmera usada só na pré-visualização da tela de entrada
    localStream:null,     // stream real usada na chamada (áudio [+vídeo])
    avatarDataUrl:null,
    micOn:true,
    camOn:true,
    chatOpen:true,
    unread:0,
    pendingAttachment:null,
    selectedCameraId:null,

    screenStream:null,
    isScreenSharing:false,

    configPromise:null,
    serverUrl:null,
    demoMode:false,
    usedFallback:false,

    socket:null,
    myId:null,
    players:{},          // { id: {name, mode, avatarDataUrl, micOn, camOn, telaCompartilhada} }, vem do servidor
    peerConnections:{},  // id -> RTCPeerConnection
    remoteStreams:{},    // id -> MediaStream
    videoSenders:{},     // id -> RTCRtpSender (transceiver de vídeo reservado por conexão)
    audioMeters:{}       // id -> { ctx, raf }
  };

  // busca o config.json (com a URL do túnel) assim que a página carrega,
  // em paralelo com a pessoa preenchendo o formulário de entrada
  state.configPromise = fetch('config.json', { cache:'no-store' })
    .then(function(r){ return r.ok ? r.json() : {}; })
    .catch(function(){ return {}; })
    .then(function(cfg){
      var url = cfg && cfg.serverUrl;
      if(url && /^https?:\/\//i.test(url)){
        state.serverUrl = url;
      } else {
        state.demoMode = true;
      }
    });

  // ---------- element refs ----------
  var el = {
    inputName:document.getElementById('input-name'),
    btnModeCamera:document.getElementById('btn-mode-camera'),
    btnModeAvatar:document.getElementById('btn-mode-avatar'),
    btnModeNenhum:document.getElementById('btn-mode-nenhum'),
    cameraSelect:document.getElementById('camera-select'),
    previewZone:document.getElementById('preview-zone'),
    previewVideo:document.getElementById('preview-video'),
    previewAvatarImg:document.getElementById('preview-avatar-img'),
    previewPlaceholder:document.getElementById('preview-placeholder'),
    previewPlaceholderText:document.getElementById('preview-placeholder-text'),
    btnUploadAvatar:document.getElementById('btn-upload-avatar'),
    inputAvatarFile:document.getElementById('input-avatar-file'),
    hintError:document.getElementById('hint-error'),
    btnEnter:document.getElementById('btn-enter'),

    screenEntry:document.getElementById('screen-entry'),
    screenRoom:document.getElementById('screen-room'),

    videoGrid:document.getElementById('video-grid'),
    participantCount:document.getElementById('participant-count'),

    btnToggleChat:document.getElementById('btn-toggle-chat'),
    btnCloseChat:document.getElementById('btn-close-chat'),
    chatPanel:document.getElementById('chat-panel'),
    chatBadge:document.getElementById('chat-badge'),
    chatMessages:document.getElementById('chat-messages'),

    attachPreview:document.getElementById('attach-preview'),
    attachPreviewName:document.getElementById('attach-preview-name'),
    btnRemoveAttach:document.getElementById('btn-remove-attach'),

    emojiPopup:document.getElementById('emoji-popup'),
    btnAttach:document.getElementById('btn-attach'),
    btnEmoji:document.getElementById('btn-emoji'),
    chatTextInput:document.getElementById('chat-text-input'),
    btnSend:document.getElementById('btn-send'),
    chatFileInput:document.getElementById('chat-file-input'),

    btnToggleMic:document.getElementById('btn-toggle-mic'),
    btnToggleCam:document.getElementById('btn-toggle-cam'),
    btnScreenshare:document.getElementById('btn-screenshare'),
    btnQuickEmoji:document.getElementById('btn-quick-emoji'),
    reactionPopup:document.getElementById('reaction-popup'),
    btnLeave:document.getElementById('btn-leave')
  };

  // ---------- helpers ----------
  function initials(name){
    var parts = name.trim().split(/\s+/).filter(Boolean);
    if(!parts.length) return "?";
    if(parts.length === 1) return parts[0].slice(0,2).toUpperCase();
    return (parts[0][0] + parts[parts.length-1][0]).toUpperCase();
  }

  function escapeHtml(str){
    var d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  // ---------- entry: mode toggle ----------
  function setMode(mode){
    state.mode = mode;
    el.btnModeCamera.classList.toggle('active', mode === 'camera');
    el.btnModeAvatar.classList.toggle('active', mode === 'avatar');
    el.btnModeNenhum.classList.toggle('active', mode === 'nenhum');
    el.btnUploadAvatar.style.display = mode === 'avatar' ? 'block' : 'none';
    el.cameraSelect.style.display = 'none';
    el.btnToggleCam.disabled = mode !== 'camera';

    if(mode === 'camera'){
      el.previewAvatarImg.style.display = 'none';
      startLocalCamera();
    } else {
      stopPreviewCamera();
      el.previewVideo.style.display = 'none';
      if(mode === 'avatar' && state.avatarDataUrl){
        el.previewAvatarImg.src = state.avatarDataUrl;
        el.previewAvatarImg.style.display = 'block';
        el.previewPlaceholder.style.display = 'none';
      } else {
        el.previewAvatarImg.style.display = 'none';
        el.previewPlaceholder.style.display = 'flex';
        el.previewPlaceholderText.textContent = mode === 'avatar'
          ? 'Escolha uma imagem para seu avatar'
          : 'Você vai entrar só com áudio, sem vídeo';
      }
    }
  }

  el.btnModeCamera.addEventListener('click', function(){ setMode('camera'); });
  el.btnModeAvatar.addEventListener('click', function(){ setMode('avatar'); });
  el.btnModeNenhum.addEventListener('click', function(){ setMode('nenhum'); });

  el.btnUploadAvatar.addEventListener('click', function(){ el.inputAvatarFile.click(); });
  el.inputAvatarFile.addEventListener('change', function(e){
    var file = e.target.files && e.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(ev){
      var img = new Image();
      img.onload = function(){
        var MAX_DIM = 320;
        var scale = Math.min(1, MAX_DIM / Math.max(img.width, img.height));
        var w = Math.max(1, Math.round(img.width * scale));
        var h = Math.max(1, Math.round(img.height * scale));
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        state.avatarDataUrl = canvas.toDataURL('image/jpeg', 0.78);
        el.previewAvatarImg.src = state.avatarDataUrl;
        el.previewAvatarImg.style.display = 'block';
        el.previewPlaceholder.style.display = 'none';
      };
      img.onerror = function(){
        // se por algum motivo não der pra processar, usa a imagem original mesmo
        state.avatarDataUrl = ev.target.result;
        el.previewAvatarImg.src = state.avatarDataUrl;
        el.previewAvatarImg.style.display = 'block';
        el.previewPlaceholder.style.display = 'none';
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });

  function startLocalCamera(){
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      el.previewPlaceholder.style.display = 'flex';
      el.previewPlaceholderText.textContent = 'Câmera não disponível neste navegador';
      return;
    }
    if(state.previewStream){
      el.previewVideo.srcObject = state.previewStream;
      el.previewVideo.style.display = 'block';
      el.previewPlaceholder.style.display = 'none';
      return;
    }
    var constraints = { video: state.selectedCameraId ? { deviceId:{ exact:state.selectedCameraId } } : true, audio:false };
    navigator.mediaDevices.getUserMedia(constraints).then(function(stream){
      state.previewStream = stream;
      el.previewVideo.srcObject = stream;
      el.previewVideo.style.display = 'block';
      el.previewPlaceholder.style.display = 'none';
      popularSeletorDeCamera();
    }).catch(function(){
      el.previewPlaceholder.style.display = 'flex';
      el.previewPlaceholderText.textContent = 'Não foi possível acessar a câmera — verifique as permissões';
    });
  }

  function popularSeletorDeCamera(){
    if(!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) return;
    navigator.mediaDevices.enumerateDevices().then(function(devices){
      var cameras = devices.filter(function(d){ return d.kind === 'videoinput'; });
      if(cameras.length < 2){
        el.cameraSelect.style.display = 'none';
        return;
      }
      el.cameraSelect.innerHTML = '';
      cameras.forEach(function(cam, i){
        var opt = document.createElement('option');
        opt.value = cam.deviceId;
        opt.textContent = cam.label || ('Câmera ' + (i + 1));
        el.cameraSelect.appendChild(opt);
      });
      if(state.selectedCameraId) el.cameraSelect.value = state.selectedCameraId;
      el.cameraSelect.style.display = state.mode === 'camera' ? 'block' : 'none';
    }).catch(function(){});
  }

  el.cameraSelect.addEventListener('change', function(){
    state.selectedCameraId = el.cameraSelect.value || null;
    stopPreviewCamera();
    startLocalCamera();
  });

  function stopPreviewCamera(){
    if(state.previewStream){
      state.previewStream.getTracks().forEach(function(t){ t.stop(); });
      state.previewStream = null;
    }
  }

  // try camera preview on load since camera mode is default
  setMode('camera');

  // ---------- entry: submit ----------
  el.btnEnter.addEventListener('click', function(){
    var name = el.inputName.value.trim();
    if(!name){
      el.hintError.style.display = 'block';
      el.inputName.focus();
      return;
    }
    el.hintError.style.display = 'none';
    state.name = name;
    el.btnEnter.disabled = true;
    acquireCallMediaAndEnter();
  });
  el.inputName.addEventListener('keydown', function(e){
    if(e.key === 'Enter') el.btnEnter.click();
  });

  function acquireCallMediaAndEnter(){
    stopPreviewCamera();

    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      state.localStream = null;
      proceedToRoom();
      return;
    }

    var videoConstraint = state.selectedCameraId ? { deviceId:{ exact:state.selectedCameraId } } : true;
    var constraints = state.mode === 'camera' ? { audio:true, video:videoConstraint } : { audio:true, video:false };
    navigator.mediaDevices.getUserMedia(constraints).then(function(stream){
      state.localStream = stream;
      proceedToRoom();
    }).catch(function(){
      // se pediu câmera e falhou (sem webcam, permissão negada etc.), tenta só o áudio
      if(state.mode === 'camera'){
        navigator.mediaDevices.getUserMedia({ audio:true }).then(function(s){
          state.localStream = s;
          state.camOn = false;
          proceedToRoom();
        }).catch(function(){
          state.localStream = null;
          proceedToRoom();
        });
      } else {
        state.localStream = null;
        proceedToRoom();
      }
    });
  }

  // ---------- room ----------
  function buildTile(opts){
    var tile = document.createElement('div');
    tile.className = 'tile' + (opts.self ? ' self' : '') + (opts.featured ? ' featured' : '') + (opts.sharing ? ' sharing' : '');
    tile.dataset.tileId = opts.id;

    var brackets = document.createElement('div');
    brackets.className = 'corner-brackets';
    brackets.innerHTML = '<span></span><span></span><span></span><span></span>';
    tile.appendChild(brackets);

    if(opts.videoStream){
      var v = document.createElement('video');
      v.autoplay = true; v.muted = !!opts.self; v.playsInline = true;
      v.srcObject = opts.videoStream;
      tile.appendChild(v);
      if(opts.sharing){
        var badge = document.createElement('div');
        badge.className = 'tile-screensharing';
        badge.innerHTML = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg> Tela';
        tile.appendChild(badge);
      }
    } else {
      var av = document.createElement('div');
      av.className = 'tile-avatar';
      if(opts.imgSrc){
        var img = document.createElement('img');
        img.src = opts.imgSrc;
        av.appendChild(img);
      } else {
        av.textContent = opts.initials;
      }
      tile.appendChild(av);

      // sem vídeo nessa aba (avatar ou câmera desligada) — o áudio precisa
      // de um elemento próprio pra tocar, já que não tem <video> pra "carregar" ele
      if(opts.audioStream){
        var audioEl = document.createElement('audio');
        audioEl.autoplay = true;
        audioEl.muted = !!opts.self;
        audioEl.srcObject = opts.audioStream;
        audioEl.style.display = 'none';
        tile.appendChild(audioEl);
      }
    }

    var label = document.createElement('div');
    label.className = 'tile-label';
    label.innerHTML = escapeHtml(opts.name) + (opts.micOff ? ' <span class="mic-off">🔇</span>' : '');
    tile.appendChild(label);

    return tile;
  }

  function renderGrid(){
    el.videoGrid.innerHTML = '';
    var tilesDestaque = [];
    var tilesNormais = [];

    var selfOpts = { self:true, id:'self', name:state.name || 'Você', micOff:!state.micOn };
    if(state.isScreenSharing && state.screenStream){
      selfOpts.videoStream = state.screenStream;
      selfOpts.sharing = true;
      selfOpts.featured = true;
    } else if(state.mode === 'camera' && state.camOn && state.localStream && state.localStream.getVideoTracks().length){
      selfOpts.videoStream = state.localStream;
    } else if(state.mode === 'avatar' && state.avatarDataUrl){
      selfOpts.imgSrc = state.avatarDataUrl;
    } else {
      selfOpts.initials = initials(state.name || '?');
    }
    (selfOpts.featured ? tilesDestaque : tilesNormais).push(selfOpts);

    if(state.demoMode){
      MOCK_PEOPLE.forEach(function(p, i){
        tilesNormais.push({ id:'mock'+i, name:p.name, initials:p.initials, micOff:false });
      });
      el.participantCount.textContent = (MOCK_PEOPLE.length + 1) + ' participantes (demonstração)';
    } else {
      var ids = Object.keys(state.players);
      ids.forEach(function(id){
        if(id === state.myId) return;
        var p = state.players[id];
        var remoteStream = state.remoteStreams[id];
        var opts = { id:id, name:p.name, micOff:!p.micOn };
        var temVideoAtivo = remoteStream && remoteStream.getVideoTracks().length && (p.camOn || p.telaCompartilhada);
        console.log('[DIAG] renderGrid p=' + id + ' camOn=' + p.camOn + ' telaCompartilhada=' + p.telaCompartilhada + ' remoteStream?=' + !!remoteStream + ' videoTracks=' + (remoteStream ? remoteStream.getVideoTracks().length : 'n/a') + ' -> mostra vídeo? ' + !!temVideoAtivo);
        if(temVideoAtivo){
          opts.videoStream = remoteStream;
          if(p.telaCompartilhada){ opts.sharing = true; opts.featured = true; }
        } else if(p.avatarDataUrl){
          opts.imgSrc = p.avatarDataUrl;
          opts.audioStream = remoteStream;
        } else {
          opts.initials = initials(p.name || '?');
          opts.audioStream = remoteStream;
        }
        (opts.featured ? tilesDestaque : tilesNormais).push(opts);
      });

      var total = ids.length || 1;
      el.participantCount.textContent = total + (total === 1 ? ' participante' : ' participantes');
    }

    el.videoGrid.classList.toggle('spotlight-mode', tilesDestaque.length > 0);
    tilesDestaque.forEach(function(o){ el.videoGrid.appendChild(buildTile(o)); });
    tilesNormais.forEach(function(o){ el.videoGrid.appendChild(buildTile(o)); });
  }

  function proceedToRoom(){
    el.screenEntry.classList.remove('active');
    el.screenRoom.classList.add('active');
    renderGrid();
    setupAudioMeter('self', state.localStream);

    state.configPromise.then(function(){
      if(state.demoMode || !state.serverUrl){
        runDemoMode();
      } else {
        connectSocket();
      }
    });
  }

  function runDemoMode(){
    state.demoMode = true;
    showDemoBanner();
    renderGrid();
    addSystemMessage('Modo demonstração — o backend ainda não está conectado.');
    setTimeout(function(){
      addChatMessage({ name:'Ana Ferreira', own:false, text:'Oi! Bem-vindo à sala 👋' });
    }, 900);
  }

  function showDemoBanner(){
    if(document.getElementById('demo-banner')) return;
    var b = document.createElement('div');
    b.id = 'demo-banner';
    b.className = 'demo-banner';
    b.textContent = 'Modo demonstração — backend ainda não conectado. Vídeo e chat funcionam só localmente.';
    el.screenRoom.insertBefore(b, el.screenRoom.firstChild);
  }

  function hideDemoBanner(){
    var b = document.getElementById('demo-banner');
    if(b) b.remove();
  }

  // ---------- Socket.io + WebRTC ----------
  function connectSocket(){
    if(typeof io === 'undefined'){
      addSystemMessage('Biblioteca de conexão não carregou.');
      runDemoMode();
      return;
    }

    var socket = io(state.serverUrl, {
      transports:['polling','websocket'],
      timeout:6000,
      reconnectionDelay:1000,
      reconnectionDelayMax:5000
    });
    state.socket = socket;
    var jaEntrouUmaVez = false;

    socket.on('connect', function(){
      state.myId = socket.id;
      hideDemoBanner();
      socket.emit('entrar', {
        nome:state.name,
        modo:state.mode,
        avatarDataUrl: state.mode === 'avatar' ? state.avatarDataUrl : null
      });
      if(!jaEntrouUmaVez){
        jaEntrouUmaVez = true;
        addSystemMessage('Você entrou na sala.');
      } else {
        addSystemMessage('Reconectado.');
      }
    });

    socket.on('connect_error', function(){
      if(!state.usedFallback){
        state.usedFallback = true;
        addSystemMessage('Não foi possível conectar ao servidor — mostrando modo demonstração.');
        runDemoMode();
      }
    });

    socket.on('disconnect', function(){
      if(jaEntrouUmaVez) addSystemMessage('Conexão instável — reconectando…');
    });

    socket.on('estado', onEstadoUpdate);
    socket.on('mensagem', onMensagem);
    socket.on('reacao', onReacao);
    socket.on('webrtc-offer', onWebrtcOffer);
    socket.on('webrtc-answer', onWebrtcAnswer);
    socket.on('webrtc-ice', onWebrtcIce);
  }

  function onEstadoUpdate(playersDict){
    var prevIds = Object.keys(state.players);
    var newIds = Object.keys(playersDict);
    state.players = playersDict;

    newIds.forEach(function(id){
      if(id === state.myId) return;
      if(!state.peerConnections[id]){
        var initiator = state.myId < id;
        createPeerConnection(id, initiator);
      }
    });

    prevIds.forEach(function(id){
      if(newIds.indexOf(id) === -1 && state.peerConnections[id]){
        closePeerConnection(id);
      }
    });

    renderGrid();
  }

  function createPeerConnection(peerId, initiator){
    var pc = new RTCPeerConnection(ICE_SERVERS);
    state.peerConnections[peerId] = pc;

    if(state.localStream){
      state.localStream.getAudioTracks().forEach(function(track){
        pc.addTrack(track, state.localStream);
      });
    }

    // vídeo sempre reserva um transceiver 'sendrecv' desde o início, mesmo sem
    // nenhuma track pra enviar agora — assim, ligar a câmera ou compartilhar tela
    // depois é só um replaceTrack(), sem precisar renegociar a conexão.
    var streamsIniciais = state.localStream ? [state.localStream] : [];
    var videoTransceiver = pc.addTransceiver('video', { direction:'sendrecv', streams:streamsIniciais });
    state.videoSenders[peerId] = videoTransceiver.sender;
    console.log('[DIAG] videoSender registrado para ' + peerId + ' | total agora=' + Object.keys(state.videoSenders).length);
    if(state.mode === 'camera' && state.localStream && state.localStream.getVideoTracks().length){
      videoTransceiver.sender.replaceTrack(state.localStream.getVideoTracks()[0]);
    } else if(state.isScreenSharing && state.screenStream){
      videoTransceiver.sender.replaceTrack(state.screenStream.getVideoTracks()[0]);
    }

    pc.onicecandidate = function(e){
      if(e.candidate) state.socket.emit('webrtc-ice', { to:peerId, candidate:e.candidate });
    };

    pc.oniceconnectionstatechange = function(){
      console.log('[DIAG] ' + peerId + ' iceConnectionState=' + pc.iceConnectionState + ' signalingState=' + pc.signalingState);
    };

    pc.ontrack = function(e){
      console.log('[DIAG] ontrack recebido de ' + peerId + ' kind=' + e.track.kind + ' readyState=' + e.track.readyState);
      if(!state.remoteStreams[peerId]){
        state.remoteStreams[peerId] = new MediaStream();
      }
      var streamDoPeer = state.remoteStreams[peerId];
      if(streamDoPeer.getTracks().indexOf(e.track) === -1){
        streamDoPeer.addTrack(e.track);
      }
      setupAudioMeter(peerId, streamDoPeer);
      renderGrid();
    };

    if(initiator){
      pc.getTransceivers().forEach(function(t){ if(t.direction !== 'sendrecv') t.direction = 'sendrecv'; });
      pc.createOffer().then(function(offer){
        return pc.setLocalDescription(offer);
      }).then(function(){
        state.socket.emit('webrtc-offer', { to:peerId, offer:pc.localDescription });
        console.log('[DIAG] oferta enviada p/ ' + peerId + ' | transceivers=' + JSON.stringify(pc.getTransceivers().map(function(t){ return { kind:(t.sender&&t.sender.track?t.sender.track.kind:(t.receiver&&t.receiver.track?t.receiver.track.kind:'?')), direction:t.direction, currentDirection:t.currentDirection }; })));
      });
    }

    return pc;
  }

  function onWebrtcOffer(data){
    var pc = state.peerConnections[data.from] || createPeerConnection(data.from, false);
    pc.setRemoteDescription(new RTCSessionDescription(data.offer)).then(function(){
      pc.getTransceivers().forEach(function(t){ if(t.direction !== 'sendrecv') t.direction = 'sendrecv'; });
      return pc.createAnswer();
    }).then(function(answer){
      return pc.setLocalDescription(answer);
    }).then(function(){
      state.socket.emit('webrtc-answer', { to:data.from, answer:pc.localDescription });
      console.log('[DIAG] resposta enviada p/ ' + data.from + ' | transceivers=' + JSON.stringify(pc.getTransceivers().map(function(t){ return { kind:(t.sender&&t.sender.track?t.sender.track.kind:(t.receiver&&t.receiver.track?t.receiver.track.kind:'?')), direction:t.direction, currentDirection:t.currentDirection }; })));
    });
  }

  function onWebrtcAnswer(data){
    var pc = state.peerConnections[data.from];
    if(pc) pc.setRemoteDescription(new RTCSessionDescription(data.answer));
  }

  function onWebrtcIce(data){
    var pc = state.peerConnections[data.from];
    if(pc && data.candidate){
      pc.addIceCandidate(new RTCIceCandidate(data.candidate)).catch(function(){});
    }
  }

  function closePeerConnection(id){
    var pc = state.peerConnections[id];
    if(pc){ pc.close(); delete state.peerConnections[id]; }
    delete state.remoteStreams[id];
    delete state.videoSenders[id];
    teardownAudioMeter(id);
  }

  // ---------- indicador de fala (Web Audio) ----------
  function setupAudioMeter(id, stream){
    teardownAudioMeter(id);
    if(!stream || !stream.getAudioTracks().length) return;
    try{
      var AudioCtx = window.AudioContext || window.webkitAudioContext;
      var ctx = new AudioCtx();
      var source = ctx.createMediaStreamSource(stream);
      var analyser = ctx.createAnalyser();
      analyser.fftSize = 512;
      source.connect(analyser);
      var data = new Uint8Array(analyser.frequencyBinCount);

      state.audioMeters[id] = { ctx:ctx, raf:null };

      function tick(){
        if(!state.audioMeters[id]) return;
        analyser.getByteFrequencyData(data);
        var sum = 0;
        for(var i=0;i<data.length;i++) sum += data[i];
        var avg = sum / data.length;
        var tileEl = document.querySelector('[data-tile-id="'+id+'"]');
        if(tileEl) tileEl.classList.toggle('speaking', avg > 18);
        state.audioMeters[id].raf = requestAnimationFrame(tick);
      }
      tick();
    }catch(e){ /* Web Audio indisponível — segue sem o indicador de fala */ }
  }

  function teardownAudioMeter(id){
    var m = state.audioMeters[id];
    if(m){
      if(m.raf) cancelAnimationFrame(m.raf);
      if(m.ctx) m.ctx.close();
      delete state.audioMeters[id];
    }
  }

  // ---------- controls ----------
  el.btnToggleMic.addEventListener('click', function(){
    state.micOn = !state.micOn;
    if(state.localStream){
      state.localStream.getAudioTracks().forEach(function(t){ t.enabled = state.micOn; });
    }
    el.btnToggleMic.classList.toggle('on', state.micOn);
    el.btnToggleMic.classList.toggle('off', !state.micOn);
    if(state.socket && state.socket.connected) state.socket.emit('mic-estado', { ligado:state.micOn });
    renderGrid();
  });

  el.btnToggleCam.addEventListener('click', function(){
    if(state.mode === 'avatar') return;
    state.camOn = !state.camOn;
    if(state.localStream){
      state.localStream.getVideoTracks().forEach(function(t){ t.enabled = state.camOn; });
    }
    el.btnToggleCam.classList.toggle('on', state.camOn);
    el.btnToggleCam.classList.toggle('off', !state.camOn);
    if(state.socket && state.socket.connected) state.socket.emit('cam-estado', { ligada:state.camOn });
    renderGrid();
  });

  function iniciarCompartilhamentoTela(){
    if(!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia){
      addSystemMessage('Seu navegador não suporta compartilhamento de tela.');
      return;
    }
    navigator.mediaDevices.getDisplayMedia({ video:true, audio:false }).then(function(screenStream){
      state.screenStream = screenStream;
      state.isScreenSharing = true;

      var screenTrack = screenStream.getVideoTracks()[0];
      var ids = Object.keys(state.videoSenders);
      console.log('[DIAG] compartilhamento iniciado. peers registrados em videoSenders: ' + JSON.stringify(ids) + ' | conexões abertas: ' + JSON.stringify(Object.keys(state.peerConnections)));
      ids.forEach(function(id){
        try{
          var resultado = state.videoSenders[id].replaceTrack(screenTrack);
          if(resultado && resultado.then){
            resultado.then(function(){ console.log('[DIAG] replaceTrack OK -> ' + id); })
                      .catch(function(err){ console.log('[DIAG] replaceTrack ERRO -> ' + id + ': ' + err); });
          } else {
            console.log('[DIAG] replaceTrack chamado (sem promise) -> ' + id);
          }
        }catch(err){
          console.log('[DIAG] replaceTrack EXCEÇÃO -> ' + id + ': ' + err);
        }
      });

      screenTrack.onended = function(){ pararCompartilhamentoTela(); };

      el.btnScreenshare.classList.add('on');
      el.btnToggleCam.disabled = true;
      if(state.socket && state.socket.connected) state.socket.emit('tela-estado', { compartilhando:true });
      renderGrid();
    }).catch(function(err){
      console.log('[DIAG] getDisplayMedia falhou/cancelado: ' + err);
    });
  }

  function pararCompartilhamentoTela(){
    if(!state.isScreenSharing) return;
    state.isScreenSharing = false;

    if(state.screenStream){
      state.screenStream.getTracks().forEach(function(t){ t.stop(); });
      state.screenStream = null;
    }

    var novaTrackVideo = (state.mode === 'camera' && state.localStream) ? state.localStream.getVideoTracks()[0] : null;
    Object.keys(state.videoSenders).forEach(function(id){
      state.videoSenders[id].replaceTrack(novaTrackVideo || null);
    });

    el.btnScreenshare.classList.remove('on');
    el.btnToggleCam.disabled = state.mode !== 'camera';
    if(state.socket && state.socket.connected) state.socket.emit('tela-estado', { compartilhando:false });
    renderGrid();
  }

  el.btnScreenshare.addEventListener('click', function(){
    if(state.isScreenSharing) pararCompartilhamentoTela();
    else iniciarCompartilhamentoTela();
  });

  el.btnLeave.addEventListener('click', function(){
    leaveRoom();
  });

  function leaveRoom(){
    Object.keys(state.peerConnections).forEach(closePeerConnection);
    teardownAudioMeter('self');

    if(state.screenStream){
      state.screenStream.getTracks().forEach(function(t){ t.stop(); });
      state.screenStream = null;
    }
    state.isScreenSharing = false;
    el.btnScreenshare.classList.remove('on');

    if(state.localStream){
      state.localStream.getTracks().forEach(function(t){ t.stop(); });
      state.localStream = null;
    }
    if(state.socket){
      state.socket.disconnect();
      state.socket = null;
    }

    state.players = {};
    state.remoteStreams = {};
    state.myId = null;
    state.demoMode = false;
    state.usedFallback = false;

    hideDemoBanner();
    el.screenRoom.classList.remove('active');
    el.screenEntry.classList.add('active');
    el.chatMessages.innerHTML = '';
    el.btnEnter.disabled = false;
    el.btnToggleCam.disabled = false;
    el.btnToggleMic.classList.add('on'); el.btnToggleMic.classList.remove('off');
    el.btnToggleCam.classList.add('on'); el.btnToggleCam.classList.remove('off');
    state.micOn = true; state.camOn = true;
    setMode(state.mode);
  }

  // ---------- chat panel toggle ----------
  function setChatOpen(open){
    state.chatOpen = open;
    el.chatPanel.classList.toggle('hidden', !open);
    if(open){
      state.unread = 0;
      updateBadge();
    }
  }
  el.btnToggleChat.addEventListener('click', function(){ setChatOpen(!state.chatOpen); });
  el.btnCloseChat.addEventListener('click', function(){ setChatOpen(false); });

  function updateBadge(){
    if(state.unread > 0 && !state.chatOpen){
      el.chatBadge.hidden = false;
      el.chatBadge.textContent = state.unread > 9 ? '9+' : state.unread;
    } else {
      el.chatBadge.hidden = true;
    }
  }

  // ---------- chat messages ----------
  function addSystemMessage(text){
    var div = document.createElement('div');
    div.style.cssText = 'text-align:center;font-size:11px;color:var(--text-dim);letter-spacing:.3px;';
    div.textContent = text;
    el.chatMessages.appendChild(div);
    el.chatMessages.scrollTop = el.chatMessages.scrollHeight;
  }

  function addChatMessage(opts){
    var wrap = document.createElement('div');
    wrap.className = 'msg' + (opts.own ? ' own' : '');

    var meta = document.createElement('div');
    meta.className = 'msg-meta';
    meta.innerHTML = '<span class="name">' + escapeHtml(opts.name) + '</span><span>' + nowTime() + '</span>';
    wrap.appendChild(meta);

    var bubble = document.createElement('div');
    bubble.className = 'msg-bubble';

    if(opts.text){
      var p = document.createElement('div');
      p.textContent = opts.text;
      bubble.appendChild(p);
    }
    if(opts.imageDataUrl){
      var img = document.createElement('img');
      img.className = 'chat-img';
      img.src = opts.imageDataUrl;
      bubble.appendChild(img);
    }
    if(opts.fileName && !opts.imageDataUrl){
      var chip = document.createElement(opts.fileUrl ? 'a' : 'div');
      chip.className = 'file-chip';
      if(opts.fileUrl){
        chip.href = opts.fileUrl;
        chip.download = opts.fileName;
        chip.style.textDecoration = 'none';
        chip.style.color = 'inherit';
      }
      chip.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/></svg><span>' + escapeHtml(opts.fileName) + '</span>';
      bubble.appendChild(chip);
    }

    wrap.appendChild(bubble);
    el.chatMessages.appendChild(wrap);
    el.chatMessages.scrollTop = el.chatMessages.scrollHeight;

    if(!opts.own && !state.chatOpen){
      state.unread++;
      updateBadge();
    }
  }

  function nowTime(){
    var d = new Date();
    var h = String(d.getHours()).padStart(2,'0');
    var m = String(d.getMinutes()).padStart(2,'0');
    return h + ':' + m;
  }

  // ---------- sending ----------
  function sendMessage(){
    var text = el.chatTextInput.value.trim();
    var attachment = state.pendingAttachment;
    if(!text && !attachment) return;

    var connected = state.socket && state.socket.connected;

    if(connected){
      var arquivo = null;
      if(attachment){
        arquivo = {
          nome: attachment.file.name,
          isImage: attachment.isImage,
          dataUrl: attachment.dataUrl
        };
      }
      state.socket.emit('mensagem', { texto:text || null, arquivo:arquivo });
      el.chatTextInput.value = '';
      clearAttachment();
      return;
    }

    // modo demonstração — eco local, sem servidor
    var payload = { name:state.name || 'Você', own:true, text:text || null };
    if(attachment){
      if(attachment.isImage) payload.imageDataUrl = attachment.dataUrl;
      else { payload.fileName = attachment.file.name; payload.fileUrl = attachment.dataUrl; }
    }
    addChatMessage(payload);
    el.chatTextInput.value = '';
    clearAttachment();

    if(state.demoMode){
      setTimeout(function(){
        var replies = ['Combinado 👍','Recebido, obrigado!','Boa, vou dar uma olhada.','👏'];
        addChatMessage({ name:MOCK_PEOPLE[Math.floor(Math.random()*MOCK_PEOPLE.length)].name, own:false, text: replies[Math.floor(Math.random()*replies.length)] });
      }, 1100 + Math.random()*900);
    }
  }

  function onMensagem(data){
    var payload = { name:data.autor, own:(data.id === state.myId), text:data.texto };
    if(data.arquivo){
      if(data.arquivo.isImage) payload.imageDataUrl = data.arquivo.dataUrl;
      else { payload.fileName = data.arquivo.nome; payload.fileUrl = data.arquivo.dataUrl; }
    }
    addChatMessage(payload);
  }

  el.btnSend.addEventListener('click', sendMessage);
  el.chatTextInput.addEventListener('keydown', function(e){
    if(e.key === 'Enter') sendMessage();
  });

  // ---------- attachments ----------
  el.btnAttach.addEventListener('click', function(){ el.chatFileInput.click(); });
  el.chatFileInput.addEventListener('change', function(e){
    var file = e.target.files && e.target.files[0];
    if(!file) return;

    if(file.size > MAX_FILE_BYTES){
      showAttachPreview(file.name + ' — arquivo muito grande (máx. 5MB)', true);
      state.pendingAttachment = null;
      el.chatFileInput.value = '';
      return;
    }

    var isImage = file.type.indexOf('image/') === 0;
    var reader = new FileReader();
    reader.onload = function(ev){
      state.pendingAttachment = { file:file, isImage:isImage, dataUrl:ev.target.result };
      showAttachPreview(file.name, false);
    };
    reader.readAsDataURL(file);
  });

  function showAttachPreview(name, isError){
    el.attachPreviewName.textContent = name;
    el.attachPreview.style.display = 'flex';
    el.attachPreview.classList.toggle('error', !!isError);
  }
  function clearAttachment(){
    state.pendingAttachment = null;
    el.attachPreview.style.display = 'none';
    el.attachPreview.classList.remove('error');
    el.chatFileInput.value = '';
  }
  el.btnRemoveAttach.addEventListener('click', clearAttachment);

  // ---------- emoji ----------
  function buildEmojiPopup(){
    el.emojiPopup.innerHTML = '';
    EMOJIS.forEach(function(em){
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = em;
      btn.addEventListener('click', function(){
        el.chatTextInput.value += em;
        el.chatTextInput.focus();
      });
      el.emojiPopup.appendChild(btn);
    });
  }
  buildEmojiPopup();

  el.btnEmoji.addEventListener('click', function(){
    el.emojiPopup.style.display = el.emojiPopup.style.display === 'grid' ? 'none' : 'grid';
  });
  document.addEventListener('click', function(e){
    if(!el.emojiPopup.contains(e.target) && e.target !== el.btnEmoji && !el.btnEmoji.contains(e.target)){
      el.emojiPopup.style.display = 'none';
    }
    if(!el.reactionPopup.contains(e.target) && e.target !== el.btnQuickEmoji && !el.btnQuickEmoji.contains(e.target)){
      el.reactionPopup.style.display = 'none';
    }
  });

  // ---------- quick floating reaction ----------
  function spawnFloatingEmoji(emoji, x, y){
    var span = document.createElement('span');
    span.className = 'emoji-float';
    span.textContent = emoji;
    span.style.left = x + 'px';
    span.style.top = y + 'px';
    document.body.appendChild(span);
    setTimeout(function(){ span.remove(); }, 1700);
  }

  function onReacao(data){
    var tileId = data.id === state.myId ? 'self' : data.id;
    var tileEl = document.querySelector('[data-tile-id="'+tileId+'"]');
    var rect = tileEl ? tileEl.getBoundingClientRect() : el.btnQuickEmoji.getBoundingClientRect();
    spawnFloatingEmoji(data.emoji, rect.left + rect.width/2 - 13, rect.top + 10);
  }

  function enviarReacao(em){
    if(state.socket && state.socket.connected){
      state.socket.emit('reacao', { emoji:em });
    } else {
      var rect = el.btnQuickEmoji.getBoundingClientRect();
      spawnFloatingEmoji(em, rect.left + rect.width/2 - 13, rect.top - 10);
    }
  }

  function buildReactionPopup(){
    el.reactionPopup.innerHTML = '';
    EMOJIS.forEach(function(em){
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = em;
      btn.addEventListener('click', function(){
        enviarReacao(em);
        el.reactionPopup.style.display = 'none';
      });
      el.reactionPopup.appendChild(btn);
    });
  }
  buildReactionPopup();

  el.btnQuickEmoji.addEventListener('click', function(){
    el.reactionPopup.style.display = el.reactionPopup.style.display === 'grid' ? 'none' : 'grid';
  });

})();
</script>
</body>
